name: Web CI

on:
  pull_request:
    # Server source is included because e2e runs the real API (and web types.ts mirrors its schemas).
    paths:
      - "apps/web/**"
      - "apps/server/src/**"
      - "apps/server/drizzle/**"
      - "docker/**"
      - "docker-compose.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meddash
          POSTGRES_PASSWORD: meddash
          POSTGRES_DB: meddash
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U meddash"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # e2e starts the real API, which reads products from this database.
      DATABASE_URL: postgres://meddash:meddash@localhost:5433/meddash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint
      - name: Format check
        run: pnpm --filter web format:check
      - name: Typecheck
        run: pnpm --filter web typecheck
      - name: Unit tests with coverage
        run: pnpm --filter web test:coverage
      - name: Build
        run: pnpm --filter web build

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Migrate and seed the database
        run: pnpm db:migrate && pnpm db:seed
        env:
          # The server config requires a signing key even for migrations. A CI-only value, like the e2e one.
          JWT_SECRET: ci-only-jwt-secret-not-for-real-use
      - name: End-to-end tests
        run: pnpm --filter web test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/web/coverage
          if-no-files-found: ignore
