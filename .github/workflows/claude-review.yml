name: Claude PR review

# Automatic first-pass AI review on every PR that touches app code.
# Needs the Claude GitHub app installed and a CLAUDE_CODE_OAUTH_TOKEN repo secret
# (from `claude setup-token`; usage counts against the owner's Claude subscription).
# A human still approves; CI (web/server verify) is the real gate.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "apps/**"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read the root CLAUDE.md and the CLAUDE.md of each app the diff touches first.
            Report only:
            - correctness bugs and unhandled edge cases or error paths
            - security issues (input validation, secrets or personal data in logs, auth checks)
            - violations of the CLAUDE.md conventions (e.g. API contract changes missing the OpenAPI entry or web types, missing tests)
            Skip formatting and lint issues; CI and hooks already enforce those.

            Use inline comments for issues tied to specific lines, and one short summary comment with `gh pr comment`.
            If there is nothing worth flagging, say so in one line.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
