services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: meddash
      POSTGRES_PASSWORD: meddash
      POSTGRES_DB: meddash
    ports:
      # 5433 on the host so it never clashes with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first created.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meddash -d meddash"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
